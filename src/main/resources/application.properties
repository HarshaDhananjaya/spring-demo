#
# Database - DBC properties
#
spring.datasource.url=jdbc:mysql://${dbhost:localhost}:${dbport:3306}/${dbname:demo}
spring.datasource.username=${dbuser:root}
spring.datasource.password=${dbpass:SHD.Wn21}
#
# Flyway DB migration library related properties
#
spring.flyway.url=jdbc:mysql://${dbhost:localhost}:${dbport:3306}/${dbname:demo}
spring.flyway.user=${dbuser:root}
spring.flyway.password=${dbpass:SHD.Wn21}
spring.flyway.schema=${dbname:demo}
spring.flyway.createSchemas=true
spring.flyway.initSql=CREATE IF NOT EXISTS flyway_history_schema
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
#
# Application
#
spring.application.name=demo
server.error.include-message=always

